[package]
name = "avax-tx"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Khadim"]
description = "Build, decode and sign Avalanche P-Chain transactions, checked byte for byte against avalanchego"
repository = "https://github.com/KHADEVS/avax-tx"
readme = "README.md"
keywords = ["avalanche", "avax", "p-chain", "transaction", "codec"]
categories = ["cryptography::cryptocurrencies", "encoding"]
publish = false

[dependencies]
bech32 = "0.11"
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
